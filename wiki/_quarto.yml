project:
  type: website
  output-dir: _site

website:
  title: "EOS Reimagined"
  description: "The FOSS alternative to Epic Online Services — a drop-in EOS SDK replacement that wires players together over the local network, with no account, no login, and no cloud."
  site-url: https://anishgoyal1108.github.io/EOS-Reimagined/
  repo-url: https://github.com/anishgoyal1108/EOS-Reimagined
  repo-subdir: wiki
  repo-branch: foundation
  repo-actions: [edit, issue]
  favicon: assets/logo.svg
  image: assets/logo.svg
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  announcement:
    icon: cone-striped
    dismissable: true
    type: primary
    position: below-navbar
    content: "**Work in progress** — the multiplayer and social core is live; discovery is LAN-only today. See the [roadmap](/users/roadmap.qmd) for exactly what works."

  navbar:
    logo: assets/logo.svg
    logo-alt: "EOS Reimagined logo"
    title: "EOS Reimagined"
    pinned: true
    left:
      - text: "For users"
        href: users/index.qmd
      - text: "For developers"
        href: developers/index.qmd
      - text: "Roadmap"
        href: users/roadmap.qmd
    right:
      - icon: github
        href: https://github.com/anishgoyal1108/EOS-Reimagined
        aria-label: "GitHub repository"

  search:
    location: navbar
    type: overlay

  sidebar:
    - id: users
      title: "For users"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: users/index.qmd
        - section: "Set it up"
          contents:
            - text: "Getting started"
              href: users/getting-started.qmd
            - text: "Building from source"
              href: users/building.qmd
            - text: "Configuration (eosr.json)"
              href: users/configuration.qmd
            - text: "Identity & profiles"
              href: users/identity-and-profiles.qmd
            - text: "Networking & firewalls"
              href: users/networking.qmd
        - section: "When something's off"
          contents:
            - text: "Tracing & diagnostics"
              href: users/tracing.qmd
            - text: "Troubleshooting & FAQ"
              href: users/troubleshooting.qmd
        - section: "The project"
          contents:
            - text: "Roadmap & status"
              href: users/roadmap.qmd
            - text: "Scope & non-goals"
              href: users/scope.qmd
    - id: developers
      title: "For developers"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: developers/index.qmd
        - text: "Contributing"
          href: developers/contributing.qmd
        - section: "Internals: the spec"
          contents:
            - text: "Spec overview"
              href: developers/internals/index.qmd
            - text: "Architecture"
              href: developers/internals/architecture.qmd
            - text: "Network protocol"
              href: developers/internals/protocol.qmd
            - text: "ADR 0001 — Mesh identity"
              href: developers/internals/adr/0001-authenticated-mesh-identity.qmd
            - text: "Tracing & config contract"
              href: developers/internals/alpha-tracing.qmd
        - section: "Status ledgers"
          contents:
            - text: "Progress manifest"
              href: developers/internals/progress.qmd
            - text: "Export-surface census"
              href: developers/internals/export-surface-census.qmd
        - section: "Identity & social"
          contents:
            - text: "Client + Platform bootstrap"
              href: developers/internals/client.qmd
            - text: "Auth"
              href: developers/internals/auth.qmd
            - text: "Connect"
              href: developers/internals/connect.qmd
            - text: "Presence"
              href: developers/internals/presence.qmd
            - text: "Friends"
              href: developers/internals/friends.qmd
            - text: "UserInfo"
              href: developers/internals/userinfo.qmd
        - section: "Multiplayer"
          contents:
            - text: "P2P"
              href: developers/internals/p2p.qmd
            - text: "Sessions"
              href: developers/internals/sessions.qmd
            - text: "Lobby"
              href: developers/internals/lobby.qmd
        - section: "Content & economy"
          contents:
            - text: "Ecom"
              href: developers/internals/ecom.qmd
            - text: "Achievements, Stats, Leaderboards"
              href: developers/internals/achievements-stats-leaderboards.qmd
            - text: "Storage"
              href: developers/internals/storage.qmd
            - text: "Metrics"
              href: developers/internals/metrics.qmd
        - section: "Other services"
          contents:
            - text: "Anti-Cheat"
              href: developers/internals/anticheat.qmd
            - text: "Custom Invites"
              href: developers/internals/custominvites.qmd
            - text: "RTC (voice/data)"
              href: developers/internals/rtc.qmd
            - text: "IntegratedPlatform, UI, Overlay"
              href: developers/internals/integratedplatform-ui-overlay.qmd
            - text: "Misc services"
              href: developers/internals/misc-services.qmd
        - section: "Future work"
          contents:
            - text: "External social companion"
              href: developers/internals/companion-client.qmd

  page-footer:
    left: |
      EOS Reimagined is free software under the [GPL-3.0 license](https://github.com/anishgoyal1108/EOS-Reimagined/blob/main/LICENSE).
    center: |
      Not affiliated with or endorsed by Epic Games.
    right:
      - icon: github
        href: https://github.com/anishgoyal1108/EOS-Reimagined
        aria-label: "GitHub repository"

format:
  html:
    respect-user-color-scheme: true
    grid:
      body-width: 950px
      sidebar-width: 270px
      margin-width: 230px
    theme:
      light: [cosmo, styles/theme.scss]
      dark: [darkly, styles/theme.scss, styles/theme-dark.scss]
    toc: true
    toc-depth: 3
    toc-expand: 1
    code-copy: true
    code-overflow: scroll
    smooth-scroll: true
    link-external-icon: false
    link-external-newwindow: true
    fig-responsive: true
    lang: en
