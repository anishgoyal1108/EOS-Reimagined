name: CI

# Manual only: this project builds a drop-in library, and we run the matrix on demand rather
# than on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (native)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload libEOSSDK-Linux-Shipping.so
        uses: actions/upload-artifact@v4
        with:
          name: libEOSSDK-Linux-Shipping
          path: build/libEOSSDK-Linux-Shipping.so
          if-no-files-found: error

  windows-cross:
    name: Windows (MinGW-w64 cross + Wine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/build-win/.wineprefix
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 wine wine64
      - name: Configure
        run: cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-win --parallel
      - name: Test (under Wine)
        run: ctest --test-dir build-win --output-on-failure
      - name: Upload EOSSDK-Win64-Shipping.dll
        uses: actions/upload-artifact@v4
        with:
          name: EOSSDK-Win64-Shipping
          path: build-win/EOSSDK-Win64-Shipping.dll
          if-no-files-found: error

  windows-msvc:
    name: Windows (native MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload EOSSDK-Win64-Shipping.dll (MSVC)
        uses: actions/upload-artifact@v4
        with:
          name: EOSSDK-Win64-Shipping-msvc
          path: build/**/EOSSDK-Win64-Shipping.dll
          if-no-files-found: error

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test leak-clean tiers
        run: ctest --test-dir build-asan -R 'unit_tests|alpha_runner_tests|release_package_tests' --output-on-failure
      - name: Test loaded-library tiers
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-asan -R 'integration_tests|integration_trace|integration_abi_mesh|export_surface' --output-on-failure
